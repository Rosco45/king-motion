<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KING - Royal Liquid Motion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Cinzel+Decorative:wght@700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient Audio Web Audio Controller (no external audio files needed) -->
  
  <!-- Interactive Fluid & Particle Canvas Background -->
  <canvas id="fluid-canvas"></canvas>

  <!-- Ambient Luxury Lighting -->
  <div class="ambient-glow royal-glow"></div>
  <div class="ambient-glow gold-glow"></div>
  <div class="vignette"></div>
  <div class="luxury-grid"></div>

  <!-- Main Showcase Container -->
  <main class="showcase-container">
    
    <!-- Top Brand Header / Tag -->
    <header class="showcase-header">
      <div class="brand-badge">
        <span class="badge-dot"></span>
        <span class="badge-text">ROYAL MOTION DESIGN</span>
      </div>
      <div class="tagline">L'ÉLÉGANCE DU ROYAUME</div>
    </header>

    <!-- Center Stage: The Crown & KING Title -->
    <section class="stage">
      
      <!-- Liquid Droplet Container (Intro Animation) -->
      <div id="drop-container" class="drop-container">
        <div class="liquid-drop"></div>
        <div class="drop-trail"></div>
      </div>

      <!-- Crown & Logo SVG Presentation -->
      <div class="logo-wrapper" id="logo-wrapper">
        <svg class="king-svg" id="king-svg" viewBox="0 0 1000 680" preserveAspectRatio="xMidYMid meet">
          <defs>
            <!-- 24K Liquid Gold Metallic Gradient -->
            <linearGradient id="liquidGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFF8D6" class="grad-stop-0" />
              <stop offset="18%" stop-color="#FCE182" class="grad-stop-1" />
              <stop offset="42%" stop-color="#F59E0B" class="grad-stop-2" />
              <stop offset="70%" stop-color="#D97706" class="grad-stop-3" />
              <stop offset="90%" stop-color="#B45309" class="grad-stop-4" />
              <stop offset="100%" stop-color="#78350F" class="grad-stop-5" />
            </linearGradient>

            <!-- Metallic Shimmer Linear Gradient -->
            <linearGradient id="shimmerGrad" x1="-100%" y1="0%" x2="200%" y2="0%">
              <stop offset="0%" stop-color="rgba(255,255,255,0)" />
              <stop offset="40%" stop-color="rgba(255,255,255,0)" />
              <stop offset="50%" stop-color="rgba(255,248,220,0.85)" />
              <stop offset="55%" stop-color="rgba(255,255,255,0.95)" />
              <stop offset="60%" stop-color="rgba(255,248,220,0.85)" />
              <stop offset="70%" stop-color="rgba(255,255,255,0)" />
              <stop offset="100%" stop-color="rgba(255,255,255,0)" />
            </linearGradient>

            <!-- Deep Inner Shadow for 3D Gold Volume -->
            <linearGradient id="innerShade" x1="50%" y1="0%" x2="50%" y2="100%">
              <stop offset="0%" stop-color="#FFEBB0" stop-opacity="0.9" />
              <stop offset="45%" stop-color="#F59E0B" stop-opacity="1" />
              <stop offset="85%" stop-color="#B45309" stop-opacity="1" />
              <stop offset="100%" stop-color="#3B1C05" stop-opacity="0.95" />
            </linearGradient>

            <!-- Liquid Ripple Filter (Dynamic SVG Filter) -->
            <filter id="liquidDisplace" x="-20%" y="-20%" width="140%" height="140%" filterUnits="objectBoundingBox">
              <feTurbulence id="fe-turb" type="fractalNoise" baseFrequency="0.015 0.02" numOctaves="3" result="noise" seed="5">
                <animate attributeName="baseFrequency" dur="10s" values="0.012 0.018;0.018 0.025;0.014 0.020;0.012 0.018" repeatCount="indefinite" />
              </feTurbulence>
              <feDisplacementMap id="fe-disp" in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G" result="displaced" />
              <feGaussianBlur in="displaced" stdDeviation="0.4" result="blurred" />
              <feMerge>
                <feMergeNode in="blurred" />
              </feMerge>
            </filter>

            <!-- Heavy Liquid Wave Distortion Filter for Splash & Surges -->
            <filter id="liquidWaveFilter" x="-30%" y="-30%" width="160%" height="160%">
              <feTurbulence id="turb-wave" type="turbulence" baseFrequency="0.02 0.03" numOctaves="2" result="turb" />
              <feDisplacementMap id="disp-wave" in="SourceGraphic" in2="turb" scale="18" xChannelSelector="R" yChannelSelector="B" />
            </filter>

            <!-- Liquid Gold Glow Filter -->
            <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
              <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.45" />
              <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#D97706" flood-opacity="0.25" />
              <feDropShadow dx="0" dy="0" stdDeviation="35" flood-color="#3B82F6" flood-opacity="0.2" />
            </filter>

            <!-- Clip Paths for Liquid Level Rising Animation -->
            <clipPath id="crownClip">
              <!-- Animated fluid wave path controlled by JS -->
              <path id="crown-liquid-wave" d="M 0,0 L 1000,0 L 1000,680 L 0,680 Z" />
            </clipPath>

            <clipPath id="textClip">
              <!-- Animated liquid wave path for text -->
              <path id="text-liquid-wave" d="M 0,0 L 1000,0 L 1000,680 L 0,680 Z" />
            </clipPath>

            <!-- Clipping mask defining exact Crown geometry -->
            <mask id="crownMask">
              <rect width="1000" height="680" fill="black" />
              <!-- Crown shape in white -->
              <use href="#crown-master-shape" fill="white" />
            </mask>

            <!-- Crown Master Shape Definition -->
            <g id="crown-master-shape">
              <!-- Base Band -->
              <path d="M 320 230 C 420 245, 580 245, 680 230 C 675 258, 590 272, 500 272 C 410 272, 325 258, 320 230 Z" />
              <!-- Crown Main Body with 5 Royal Peaks and Filigree Arches -->
              <path d="M 325 228 
                       C 310 180, 260 145, 270 95
                       C 278 125, 335 155, 375 160
                       C 385 130, 395 85, 415 50
                       C 430 90, 465 140, 500 152
                       C 535 140, 570 90, 585 50
                       C 605 85, 615 130, 625 160
                       C 665 155, 722 125, 730 95
                       C 740 145, 690 180, 675 228
                       C 610 242, 390 242, 325 228 Z" />
              <!-- Jewels on top of peaks -->
              <circle cx="270" cy="90" r="14" />
              <circle cx="415" cy="45" r="16" />
              <circle cx="500" cy="18" r="22" />
              <!-- Cross or Royal Diamond atop center peak -->
              <path d="M 500 13 L 507 20 L 500 27 L 493 20 Z" />
              <circle cx="585" cy="45" r="16" />
              <circle cx="730" cy="90" r="14" />
              <!-- Royal Base Cabochons -->
              <circle cx="370" cy="248" r="7" />
              <circle cx="435" cy="254" r="8" />
              <circle cx="500" cy="256" r="10" />
              <circle cx="565" cy="254" r="8" />
              <circle cx="630" cy="248" r="7" />
            </g>

            <!-- Pattern for Molten Gold Fluid Motion Inside -->
            <pattern id="liquidPattern" width="400" height="400" patternUnits="userSpaceOnUse">
              <path class="fluid-sine-1" d="M 0 100 Q 100 80, 200 100 T 400 100 L 400 400 L 0 400 Z" fill="url(#liquidGoldGrad)" opacity="0.6"/>
              <path class="fluid-sine-2" d="M 0 120 Q 100 140, 200 120 T 400 120 L 400 400 L 0 400 Z" fill="#FFE066" opacity="0.4"/>
            </pattern>
          </defs>

          <!-- ================= BACKGROUND AURA IN SVG ================= -->
          <radialGradient id="royalHalo" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.35" />
            <stop offset="50%" stop-color="#172554" stop-opacity="0.15" />
            <stop offset="100%" stop-color="#09090E" stop-opacity="0" />
          </radialGradient>
          <ellipse cx="500" cy="340" rx="420" ry="280" fill="url(#royalHalo)" />

          <!-- ================= CROWN GROUP ================= -->
          <g id="crown-container" class="crown-group" filter="url(#goldGlow)">
            
            <!-- 1. Hollow Golden Outlines (Drawn during intro) -->
            <path id="crown-contour" class="gold-contour" 
                  d="M 320 230 C 420 245, 580 245, 680 230 C 675 258, 590 272, 500 272 C 410 272, 325 258, 320 230 Z
                     M 325 228 
                     C 310 180, 260 145, 270 95
                     C 278 125, 335 155, 375 160
                     C 385 130, 395 85, 415 50
                     C 430 90, 465 140, 500 152
                     C 535 140, 570 90, 585 50
                     C 605 85, 615 130, 625 160
                     C 665 155, 722 125, 730 95
                     C 740 145, 690 180, 675 228
                     C 610 242, 390 242, 325 228 Z"
                  fill="none" stroke="url(#liquidGoldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

            <!-- Filigree details inside Crown -->
            <path id="crown-filigree" class="gold-contour filigree"
                  d="M 500 152 C 500 190, 440 215, 370 220 
                     M 500 152 C 500 190, 560 215, 630 220
                     M 500 65 L 500 145
                     M 465 105 Q 500 90, 535 105
                     M 450 170 Q 500 185, 550 170"
                  fill="none" stroke="#FCE182" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />

            <!-- Jewels outlines -->
            <g id="crown-jewels" class="gold-contour">
              <circle cx="270" cy="90" r="14" fill="url(#innerShade)" stroke="#FFE899" stroke-width="2" />
              <circle cx="415" cy="45" r="16" fill="url(#innerShade)" stroke="#FFE899" stroke-width="2" />
              <circle cx="500" cy="18" r="22" fill="url(#innerShade)" stroke="#FFF8D6" stroke-width="2.5" />
              <circle cx="585" cy="45" r="16" fill="url(#innerShade)" stroke="#FFE899" stroke-width="2" />
              <circle cx="730" cy="90" r="14" fill="url(#innerShade)" stroke="#FFE899" stroke-width="2" />

              <!-- Base Band Gemstones -->
              <circle cx="370" cy="248" r="7" fill="#FFE899" />
              <circle cx="435" cy="254" r="8" fill="#FFE899" />
              <circle cx="500" cy="256" r="10" fill="#FFF8D6" />
              <circle cx="565" cy="254" r="8" fill="#FFE899" />
              <circle cx="630" cy="248" r="7" fill="#FFE899" />
            </g>

            <!-- 2. Liquid Gold Body (Liquid Fluid Filling & Surface Waves) -->
            <g clip-path="url(#crownClip)" filter="url(#liquidDisplace)">
              <!-- Base Liquid Fill -->
              <use href="#crown-master-shape" fill="url(#liquidGoldGrad)" class="liquid-body" />
              
              <!-- Molten Specular Highlights inside Crown -->
              <use href="#crown-master-shape" fill="url(#shimmerGrad)" class="shimmer-fx" mix-blend-mode="color-dodge" />
            </g>

            <!-- Floating Droplet Sparks around Crown -->
            <g id="crown-sparks">
              <circle cx="490" cy="45" r="2" fill="#FFF" opacity="0.9" class="sparkle s-1" />
              <circle cx="512" cy="30" r="1.5" fill="#FFF" opacity="0.8" class="sparkle s-2" />
              <circle cx="410" cy="65" r="2" fill="#FFF" opacity="0.9" class="sparkle s-3" />
              <circle cx="590" cy="65" r="2.5" fill="#FFF" opacity="0.9" class="sparkle s-4" />
              <circle cx="275" cy="105" r="1.8" fill="#FFF" opacity="0.7" class="sparkle s-5" />
              <circle cx="725" cy="105" r="1.8" fill="#FFF" opacity="0.7" class="sparkle s-6" />
            </g>
          </g>

          <!-- ================= LIQUID CASCADING FLOW PATHS ================= -->
          <!-- Visual streams of molten gold flowing from crown into the 4 letters (K, I, N, G) -->
          <g id="liquid-cascades" class="liquid-cascades">
            <!-- Stream to K -->
            <path id="stream-k" class="liquid-stream" d="M 370 265 C 370 295, 230 290, 220 370" fill="none" stroke="url(#liquidGoldGrad)" stroke-width="4" stroke-linecap="round" />
            <!-- Stream to I -->
            <path id="stream-i" class="liquid-stream" d="M 450 270 C 450 310, 420 320, 420 370" fill="none" stroke="url(#liquidGoldGrad)" stroke-width="4" stroke-linecap="round" />
            <!-- Stream to N -->
            <path id="stream-n" class="liquid-stream" d="M 550 270 C 550 310, 580 320, 580 370" fill="none" stroke="url(#liquidGoldGrad)" stroke-width="4" stroke-linecap="round" />
            <!-- Stream to G -->
            <path id="stream-g" class="liquid-stream" d="M 630 265 C 630 295, 770 290, 780 370" fill="none" stroke="url(#liquidGoldGrad)" stroke-width="4" stroke-linecap="round" />
          </g>

          <!-- ================= "KING" TEXT GROUP ================= -->
          <g id="king-text-group" class="king-text-group" filter="url(#goldGlow)">
            
            <!-- 1. Background Glow / Shadow of Text -->
            <text x="500" y="520" text-anchor="middle" class="king-text-base text-shadow" 
                  font-family="'Cinzel Decorative', 'Cinzel', 'Times New Roman', serif"
                  font-weight="900" font-size="160" letter-spacing="24">
              KING
            </text>

            <!-- 2. Animated Outline Contour (Stroke Drawing) -->
            <text id="text-contour" x="500" y="520" text-anchor="middle" class="king-text-contour" 
                  font-family="'Cinzel Decorative', 'Cinzel', 'Times New Roman', serif"
                  font-weight="900" font-size="160" letter-spacing="24"
                  fill="none" stroke="url(#liquidGoldGrad)" stroke-width="2.5">
              KING
            </text>

            <!-- 3. Liquid Gold Fill with Rising Wave Physics and SVG Turbulence -->
            <g clip-path="url(#textClip)" filter="url(#liquidDisplace)">
              <!-- Main Liquid Fill -->
              <text id="text-liquid-fill" x="500" y="520" text-anchor="middle" class="king-text-fill"
                    font-family="'Cinzel Decorative', 'Cinzel', 'Times New Roman', serif"
                    font-weight="900" font-size="160" letter-spacing="24"
                    fill="url(#innerShade)">
                KING
              </text>

              <!-- Secondary Liquid Golden Core -->
              <text x="500" y="520" text-anchor="middle" class="king-text-core"
                    font-family="'Cinzel Decorative', 'Cinzel', 'Times New Roman', serif"
                    font-weight="900" font-size="160" letter-spacing="24"
                    fill="url(#liquidGoldGrad)" opacity="0.9">
                KING
              </text>

              <!-- Liquid Specular Sheen (Shimmer Sweeper) -->
              <text x="500" y="520" text-anchor="middle" class="king-text-shimmer shimmer-fx"
                    font-family="'Cinzel Decorative', 'Cinzel', 'Times New Roman', serif"
                    font-weight="900" font-size="160" letter-spacing="24"
                    fill="url(#shimmerGrad)">
                KING
              </text>
            </g>

            <!-- 4. Subtle 3D Bevel Overlay for Chrome/Molten Metal Edge -->
            <text x="500" y="520" text-anchor="middle" class="king-text-bevel"
                  font-family="'Cinzel Decorative', 'Cinzel', 'Times New Roman', serif"
                  font-weight="900" font-size="160" letter-spacing="24"
                  fill="none" stroke="rgba(255, 248, 220, 0.45)" stroke-width="1.2">
              KING
            </text>
          </g>

          <!-- ================= LIQUID DRIP DROPLETS ================= -->
          <!-- Dynamic droplets hanging and dripping from text edges -->
          <g id="liquid-drips" class="liquid-drips">
            <!-- Drips beneath K -->
            <circle id="drip-1" cx="195" cy="530" r="3.5" fill="url(#liquidGoldGrad)" class="drip-drop" />
            <!-- Drips beneath I -->
            <circle id="drip-2" cx="420" cy="530" r="4" fill="url(#liquidGoldGrad)" class="drip-drop" />
            <!-- Drips beneath N -->
            <circle id="drip-3" cx="585" cy="530" r="3.5" fill="url(#liquidGoldGrad)" class="drip-drop" />
            <!-- Drips beneath G -->
            <circle id="drip-4" cx="805" cy="530" r="4.5" fill="url(#liquidGoldGrad)" class="drip-drop" />
          </g>

          <!-- ================= ROYAL SUBTITLE / INSCRIPTION ================= -->
          <g class="sub-inscription" opacity="0.85">
            <line x1="330" y1="585" x2="430" y2="585" stroke="url(#liquidGoldGrad)" stroke-width="1.5" stroke-linecap="round"/>
            <polygon points="500,581 505,585 500,589 495,585" fill="#F59E0B" />
            <circle cx="465" cy="585" r="2" fill="#FCE182" />
            <circle cx="535" cy="585" r="2" fill="#FCE182" />
            <line x1="570" y1="585" x2="670" y2="585" stroke="url(#liquidGoldGrad)" stroke-width="1.5" stroke-linecap="round"/>
            <text x="500" y="618" text-anchor="middle" class="regal-sub"
                  font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" letter-spacing="10" fill="#E2E8F0">
              MAJESTÉ &bull; PUISSANCE &bull; HÉRITAGE
            </text>
          </g>
        </svg>
      </div>

      <!-- Interactive Liquid Ripple Indicator for User Hover / Touch -->
      <div class="interactive-hint">
        <span class="hint-icon">✦</span>
        <span class="hint-text">Touchez ou bougez la souris pour faire onduler l'or liquide</span>
      </div>
    </section>

    <!-- Bottom Luxury Motion Control Bar -->
    <footer class="showcase-footer">
      <div class="controls-panel">
        
        <!-- Replay Liquid Reveal Button -->
        <button id="btn-replay" class="ctrl-btn" title="Rejouer l'animation liquide">
          <svg viewBox="0 0 24 24" class="btn-icon" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
          </svg>
          <span class="btn-label">Rejouer</span>
        </button>

        <div class="divider"></div>

        <!-- Liquid Style Selector -->
        <div class="mode-selector">
          <span class="mode-title">Style Liquide:</span>
          <div class="mode-chips">
            <button class="chip active" data-mode="molten">Or Fondu 24K</button>
            <button class="chip" data-mode="chrome">Mercure Doré</button>
            <button class="chip" data-mode="imperial">Bleu Impérial</button>
          </div>
        </div>

        <div class="divider"></div>

        <!-- Ambient Sound Toggle (Web Audio API synthesis) -->
        <button id="btn-sound" class="ctrl-btn" title="Ambiance sonore royale">
          <svg id="icon-sound-off" viewBox="0 0 24 24" class="btn-icon" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 5L6 9H2v6h4l5 4V5z"/>
            <line x1="23" y1="9" x2="17" y2="15"/>
            <line x1="17" y1="9" x2="23" y2="15"/>
          </svg>
          <svg id="icon-sound-on" viewBox="0 0 24 24" class="btn-icon hidden" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
          </svg>
          <span id="sound-label" class="btn-label">Son: Muet</span>
        </button>

        <div class="divider"></div>

        <!-- Splash Wave Pulse Button -->
        <button id="btn-splash" class="ctrl-btn highlight" title="Provoquer une onde de choc liquide">
          <span class="spark-dot"></span>
          <span class="btn-label">Vague d'Or</span>
        </button>

      </div>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
